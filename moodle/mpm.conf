# Limite de processos Apache/PHP em simultâneo — protege a memória do servidor.
# Cada processo usa ~60–120 MB. Valor definido em APACHE_MAX_WORKERS no .env.
<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers         10
    ServerLimit             ${APACHE_MAX_WORKERS}
    MaxRequestWorkers       ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild 1000
</IfModule>
